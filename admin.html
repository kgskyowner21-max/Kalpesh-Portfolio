<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Editor - Kalpesh Goswami</title>
<style>
:root{--bg:#fff;--fg:#202124;--mut:#5f6368;--line:#dadce0;--pnl:#f8f9fa;--cvb:#e8eaed;--acc:#1a73e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--fg:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--pnl:#292a2d;--cvb:#171717;--acc:#8ab4f8}}
:root[data-theme="dark"]{--bg:#202124;--fg:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--pnl:#292a2d;--cvb:#171717;--acc:#8ab4f8}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:14px Arial,Helvetica,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#top,#fb{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap;position:relative}
#fb{background:var(--pnl);padding:4px 12px}
.sp{flex:1}.mut{color:var(--mut);font-size:12px;margin-left:8px}.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
button,select,input[type=text],input[type=password]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 9px}
button{cursor:pointer}button:hover:not(:disabled){background:var(--pnl)}button:disabled{opacity:.4;cursor:default}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#main{flex:1;display:flex;min-height:0}#left{flex:2;display:flex;flex-direction:column;min-width:0}
#cv{flex:1;overflow:auto;background:var(--cvb);padding:20px}
#side{flex:1;min-width:280px;max-width:420px;border-left:1px solid var(--line);overflow:auto;background:var(--bg)}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;padding:12px;border-bottom:3px solid transparent;background:none}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);background:none}
.pn{padding:14px}.pn h4{margin:16px 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{text-align:left;padding:10px}
.pr{border:1px solid var(--line);border-radius:4px;padding:8px;margin:8px 0}.pr.cur{border-color:var(--acc)}.pr a{cursor:pointer;font-weight:bold}.pr span{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}.pr small{color:var(--mut)}.pr button{padding:2px 6px;font-size:12px}
.pop{position:absolute;right:12px;top:44px;width:300px;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 16px #0003;padding:14px;z-index:20}
.pop label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}.pop input[type=text]{width:100%;box-sizing:border-box}.pop button{margin:6px 6px 0 0}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row label{flex:1}
#gate{position:fixed;inset:0;background:var(--cvb);display:flex;align-items:center;justify-content:center;z-index:50}
#gf{background:var(--bg);border:1px solid var(--line);padding:28px;border-radius:8px;width:280px;display:flex;flex-direction:column;gap:10px}
#pubv{height:100%;overflow:auto}body.pub #app,body.pub #gate{display:none}body:not(.pub) #pubv{display:none}
/* the website itself */
.frame{background:var(--sb);color:var(--st);container-type:inline-size;margin:0 auto;min-height:100%;font-size:16px;line-height:1.65}
#cv .frame{box-shadow:0 1px 6px #0004}.frame.t{max-width:768px}.frame.m{max-width:390px}
.sh{display:flex;align-items:center;gap:14px;padding:16px 32px;border-bottom:1px solid #0002}.lg{height:36px}.sn{font-size:1.2em}
.sh nav{margin-left:auto;display:flex;gap:20px}.sh nav a{color:inherit;text-decoration:none;padding:2px 0;cursor:pointer}.sh nav a.on{border-bottom:2px solid var(--p)}
.blk{position:relative;padding:12px 32px}.frame a{color:var(--p)}.frame h1{font-size:2.6em;margin:.2em 0}.frame h2{font-size:1.9em;margin:.2em 0}.frame h3{margin:.6em 0 .2em}
.btn,.frame a.btn{display:inline-block;background:var(--p);color:#fff;padding:10px 20px;border-radius:var(--r);text-decoration:none}
.cols{display:grid;gap:24px}.col img,.im,.hi{width:100%;display:block;border-radius:var(--r)}.hero{text-align:inherit;padding:24px 0}.hc{padding:16px 0}
.ph{background:#0001;border:1px dashed #0005;padding:26px;text-align:center;font:13px Arial;color:#666;cursor:pointer;border-radius:var(--r)}
.gal{position:relative;overflow:hidden;border-radius:var(--r)}.gt{display:flex;transition:transform .5s}.gt img{flex:0 0 100%;width:100%;max-height:420px;object-fit:cover}
.ga{position:absolute;top:50%;transform:translateY(-50%);background:#000a;color:#fff;border:0;font-size:22px}.ga.l{left:8px}.ga.r{right:8px}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:var(--r)}.frame hr{border:0;border-top:1px solid #0003}.frame footer{font-size:.9em;opacity:.8}
.empty{padding:40px;text-align:center;opacity:.6}
@container (max-width:700px){.cols{grid-template-columns:1fr!important}.sh{flex-wrap:wrap;padding:12px 16px}.blk{padding:10px 16px}.frame h1{font-size:2em}}
.ed .blk:hover{outline:1px dashed var(--acc)}.ed .blk.sel{outline:2px solid var(--acc)}.ed [contenteditable]:focus{outline:none}
.hd{display:none;position:absolute;left:4px;top:4px;background:var(--acc);color:#fff;font:12px Arial;padding:2px 7px;border-radius:3px;cursor:grab;z-index:2}.blk.sel .hd{display:block}
.ot{box-shadow:0 -4px 0 var(--acc)}.ob{box-shadow:0 4px 0 var(--acc)}
.frame.kg .container{width:min(1120px,calc(100% - 40px));margin-inline:auto}
.frame.kg, .frame.kg *{box-sizing: border-box;}
.frame.kg a{color: inherit; text-decoration: none;}
.frame.kg button, .frame.kg a{-webkit-tap-highlight-color: transparent;}
.frame.kg .glass{background: linear-gradient(135deg, rgba(255,255,255,.085), rgba(255,255,255,.025));
      border: 1px solid var(--kline); box-shadow: var(--kshadow); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);}
.frame.kg .site-header{position: relative; z-index: 30;}
.frame.kg .nav-wrap{position: sticky; top: 12px; z-index: 20; padding-top: 12px;}
.frame.kg .header-note{display: flex; justify-content: center; gap: 8px; padding: 8px 12px 0; color: #a59bbd; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;}
.frame.kg .header-note span{color: var(--klavender);}
.frame.kg nav{display: flex; align-items: center; justify-content: space-between; gap: 22px;
      padding: 12px 16px; border-radius: 18px; background: rgba(13,12,20,.78);
      border: 1px solid rgba(233,222,255,.12); backdrop-filter: blur(24px);}
.frame.kg .brand{display: flex; align-items: center; gap: 11px; font-weight: 750; letter-spacing: -.03em; white-space: nowrap;}
.frame.kg .brand-mark{display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; color: #171020; background: linear-gradient(135deg, #f0e7ff, #a88aff); font-size: 13px; font-weight: 900; box-shadow: 0 0 26px rgba(166,132,255,.25);}
.frame.kg .nav-links{display: flex; align-items: center; gap: 23px; color: var(--kmuted); font-size: 13px;}
.frame.kg .nav-links a:hover{color: var(--klavender);}
.frame.kg .nav-cta, .frame.kg .button{display: inline-flex; justify-content: center; align-items: center; gap: 9px; border: 1px solid rgba(233,222,255,.2);
      border-radius: 999px; padding: 11px 17px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .25s ease;}
.frame.kg .nav-cta, .frame.kg .button.primary{color: #171020; background: linear-gradient(135deg, #f0e7ff, #b49aff); box-shadow: 0 8px 30px rgba(141,107,255,.2);}
.frame.kg .button.secondary{background: rgba(255,255,255,.04); color: var(--ktext);}
.frame.kg .nav-cta:hover, .frame.kg .button:hover{transform: translateY(-2px); box-shadow: 0 12px 34px rgba(141,107,255,.25);}
.frame.kg .menu-toggle{display: none; color: var(--ktext); border: 1px solid var(--kline); background: var(--kglass); border-radius: 12px; padding: 8px 11px; font-size: 19px;}
.frame.kg .hero{min-height: 680px; display: grid; grid-template-columns: 1.12fr .88fr; gap: 42px; align-items: center; padding-block: 86px 74px;}
.frame.kg .eyebrow{display: inline-flex; align-items: center; gap: 9px; color: var(--klavender); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;}
.frame.kg .status-dot{width: 7px; height: 7px; background: var(--kmint); border-radius: 50%; box-shadow: 0 0 14px rgba(166,240,223,.7);}
.frame.kg h1{margin: 20px 0 18px; font-size: clamp(46px, 6.6cqw, 78px); line-height: .99; letter-spacing: -.075em; font-weight: 780;}
.frame.kg .gradient-text{background: linear-gradient(100deg, #fff 5%, #e9deff 38%, #a88aff 90%); -webkit-background-clip: text; background-clip: text; color: transparent;}
.frame.kg .hero-copy{max-width: 590px; color: var(--kmuted); font-size: 16px;}
.frame.kg .hero-actions{display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px;}
.frame.kg .micro-trust{display: flex; flex-wrap: wrap; gap: 17px; margin-top: 28px; color: #928ba7; font-size: 11px;}
.frame.kg .micro-trust span::before{content: "✦"; color: var(--kpurple); margin-right: 7px;}
.frame.kg .hero-art{position: relative; min-height: 440px; display: grid; place-items: center;}
.frame.kg .orb{position: absolute; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle at 32% 25%, rgba(233,222,255,.8), rgba(160,122,255,.38) 24%, rgba(96,65,177,.1) 58%, transparent 72%); filter: blur(1px); box-shadow: inset -25px -30px 60px rgba(0,0,0,.55), 0 0 90px rgba(141,107,255,.22);}
.frame.kg .orbit{position: absolute; width: 390px; height: 180px; border: 1px solid rgba(222,207,255,.25); border-radius: 50%; transform: rotate(-29deg);}
.frame.kg .orbit.two{width: 360px; height: 235px; transform: rotate(48deg); border-color: rgba(166,240,223,.17);}
.frame.kg .floating-card{position: absolute; border-radius: 18px; padding: 15px 17px; background: rgba(20,18,32,.76); border: 1px solid rgba(233,222,255,.19); backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,.3);}
.frame.kg .floating-card small{display: block; color: var(--kmuted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;}
.frame.kg .floating-card strong{display: block; margin-top: 3px; font-size: 14px;}
.frame.kg .fc-one{top: 53px; right: 0;}
.frame.kg .fc-two{left: -5px; top: 170px;}
.frame.kg .fc-three{right: 15px; bottom: 48px;}
.frame.kg .mini-chart{display: flex; align-items: end; gap: 5px; height: 27px; margin-top: 9px;}
.frame.kg .mini-chart i{display: block; width: 7px; border-radius: 3px 3px 0 0; background: linear-gradient(to top, #7251c9, #d7c5ff);}
.frame.kg section{padding-block: 78px;}
.frame.kg .section-head{max-width: 700px; margin-bottom: 30px;}
.frame.kg .section-label{color: var(--kpurple); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;}
.frame.kg h2{margin: 9px 0 12px; font-size: clamp(31px, 4cqw, 47px); line-height: 1.1; letter-spacing: -.055em;}
.frame.kg .section-head p, .frame.kg .muted{color: var(--kmuted);}
.frame.kg .about-grid{display: grid; grid-template-columns: 1.05fr .95fr; gap: 20px;}
.frame.kg .about-panel{border-radius: var(--kradius); padding: 28px;}
.frame.kg .about-panel p{color: var(--kmuted); margin-top: 0;}
.frame.kg .quote-line{padding-left: 17px; border-left: 2px solid var(--kpurple); color: var(--klavender) !important; font-size: 17px; line-height: 1.55;}
.frame.kg .pill-list{display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px;}
.frame.kg .pill{border: 1px solid rgba(233,222,255,.15); background: rgba(255,255,255,.035); color: #d9d0ed; border-radius: 999px; padding: 7px 11px; font-size: 11px;}
.frame.kg .expertise-grid{display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px;}
.frame.kg .expertise-card{border-radius: 19px; padding: 20px; min-height: 160px; transition: transform .25s, border-color .25s;}
.frame.kg .expertise-card:hover, .frame.kg .project-card:hover, .frame.kg .service-card:hover{transform: translateY(-4px); border-color: rgba(182,154,255,.45);}
.frame.kg .icon-box{width: 39px; height: 39px; display: grid; place-items: center; border-radius: 12px; color: var(--klavender); background: rgba(166,132,255,.12); border: 1px solid rgba(182,154,255,.2); font-size: 18px; margin-bottom: 13px;}
.frame.kg h3{margin: 0 0 7px; font-size: 15px; letter-spacing: -.02em;}
.frame.kg .expertise-card p, .frame.kg .service-card p, .frame.kg .project-card p{color: var(--kmuted); font-size: 13px; margin: 0;}
.frame.kg .projects-grid{display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;}
.frame.kg .project-card{overflow: hidden; border-radius: 22px; transition: .25s ease;}
.frame.kg .project-visual{min-height: 165px; padding: 18px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 40%, rgba(143,108,255,.25), transparent 64%), linear-gradient(135deg, #1b1729, #0f101a); border-bottom: 1px solid var(--kline);}
.frame.kg .mock-window{width: 90%; border-radius: 10px; padding: 10px; border: 1px solid rgba(233,222,255,.18); background: rgba(7,7,13,.75); transform: perspective(500px) rotateY(-7deg) rotateX(4deg); box-shadow: 0 16px 35px rgba(0,0,0,.3);}
.frame.kg .window-dots{display: flex; gap: 4px; margin-bottom: 9px;}
.frame.kg .window-dots i{width: 5px; height: 5px; border-radius: 50%; background: #9c83e8;}
.frame.kg .mock-bars{display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 7px;}
.frame.kg .mock-bars span{height: 22px; border-radius: 4px; background: rgba(173,144,255,.13); border: 1px solid rgba(173,144,255,.12);}
.frame.kg .mock-line{height: 37px; border-radius: 4px; background: linear-gradient(165deg, transparent 45%, rgba(166,240,223,.7) 46%, transparent 49%), linear-gradient(15deg, transparent 43%, rgba(173,144,255,.65) 44%, transparent 47%); border-bottom: 1px solid rgba(233,222,255,.15);}
.frame.kg .project-content{padding: 21px;}
.frame.kg .project-meta{color: var(--kpurple); font-size: 9px; font-weight: 800; letter-spacing: .13em; margin-bottom: 9px;}
.frame.kg .project-content h3{font-size: 17px;}
.frame.kg .project-note{margin-top: 12px !important; font-size: 11px !important; color: #9189a6 !important;}
.frame.kg .services-grid{display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px;}
.frame.kg .service-card{padding: 22px; border-radius: 20px; transition: .25s ease;}
.frame.kg .service-num{font-size: 11px; color: var(--kpurple); font-weight: 800; letter-spacing: .12em; margin-bottom: 18px;}
.frame.kg .process{display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; margin-top: 20px;}
.frame.kg .process-step{padding: 19px; border-top: 1px solid rgba(182,154,255,.4); background: linear-gradient(180deg, rgba(182,154,255,.06), transparent);}
.frame.kg .process-step b{display: block; font-size: 13px; margin-bottom: 5px;}
.frame.kg .process-step span{color: var(--kmuted); font-size: 12px;}
.frame.kg .contact-panel{display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 25px; padding: clamp(25px, 5cqw, 48px); border-radius: 28px; background: radial-gradient(circle at 100% 0%, rgba(141,107,255,.19), transparent 45%), linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.025));}
.frame.kg .contact-panel p{max-width: 590px; color: var(--kmuted);}
.frame.kg footer{margin-top: 28px; padding: 34px 0 22px; border-top: 1px solid rgba(233,222,255,.12); color: #8f89a2; font-size: 11px; background: linear-gradient(180deg, rgba(255,255,255,.018), rgba(10,9,16,.65));}
.frame.kg .footer-main{display: grid; grid-template-columns: 1.2fr .8fr; gap: 30px; padding-bottom: 25px;}
.frame.kg .footer-brand{display: flex; align-items: center; gap: 10px; color: var(--ktext); font-size: 15px; font-weight: 750; letter-spacing: -.03em;}
.frame.kg .footer-brand-mark{display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: #171020; background: linear-gradient(135deg, #f0e7ff, #a88aff); font-size: 12px; font-weight: 900;}
.frame.kg .footer-description{max-width: 420px; margin: 12px 0 0; color: var(--kmuted); font-size: 12px;}
.frame.kg .footer-nav-title{margin: 2px 0 10px; color: var(--klavender); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;}
.frame.kg .footer-links{display: flex; flex-wrap: wrap; gap: 10px 17px;}
.frame.kg .footer-links a:hover{color: var(--klavender);}
.frame.kg .footer-bottom{display: flex; justify-content: space-between; align-items: center; gap: 14px; padding-top: 18px; border-top: 1px solid rgba(233,222,255,.09);}
.frame.kg .footer-bottom-note{color: #777087;}
.frame.kg .reveal{opacity: 0; transform: translateY(18px); transition: opacity .65s ease, transform .65s ease;}
.frame.kg .reveal.visible{opacity: 1; transform: translateY(0);}
@media (prefers-reduced-motion: reduce){.frame.kg, .frame.kg *, .frame.kg *::before, .frame.kg *::after{scroll-behavior: auto !important; transition: none !important;}
.frame.kg .reveal{opacity: 1; transform: none;}}
@container (max-width: 900px){.frame.kg .hero{grid-template-columns: 1fr; padding-top: 65px; gap: 10px;}
.frame.kg .hero-art{min-height: 350px;}
.frame.kg .orb{width: 240px; height: 240px;}
.frame.kg .orbit{width: 320px; height: 150px;}
.frame.kg .orbit.two{width: 300px; height: 190px;}
.frame.kg .fc-two{left: 4%;}
.frame.kg .fc-one{right: 5%;}
.frame.kg .fc-three{right: 8%;}
.frame.kg .about-grid{grid-template-columns: 1fr;}
.frame.kg .projects-grid{grid-template-columns: 1fr 1fr;}
.frame.kg .projects-grid .project-card:last-child:nth-child(odd){grid-column: span 2;}
.frame.kg .services-grid{grid-template-columns: 1fr 1fr;}}
@container (max-width: 640px){.frame.kg .nav-wrap{top: 6px; padding-top: 6px;}
.frame.kg .container{width:min(1120px,calc(100% - 28px));}
.frame.kg nav{padding: 9px 10px;}
.frame.kg .brand{font-size: 13px;}
.frame.kg .brand-mark{width: 34px; height: 34px;}
.frame.kg .menu-toggle{display: inline-flex;}
.frame.kg .nav-cta{display: none;}
.frame.kg .nav-links{display: none; position: absolute; left: 0; right: 0; top: 61px; padding: 15px; border-radius: 16px; background: rgba(15,13,24,.96); border: 1px solid var(--kline); flex-direction: column; align-items: stretch; gap: 0;}
.frame.kg .nav-links.open{display: flex;}
.frame.kg .nav-links a{padding: 10px 6px;}
.frame.kg .hero{min-height: 0; padding-block: 66px 35px;}
.frame.kg h1{font-size: clamp(44px, 14cqw, 65px);}
.frame.kg .hero-copy{font-size: 14px;}
.frame.kg .hero-art{min-height: 300px; transform: scale(.92);}
.frame.kg .fc-one{top: 20px;}
.frame.kg .fc-two{top: 125px; left: -3px;}
.frame.kg .fc-three{bottom: 15px; right: -2px;}
.frame.kg section{padding-block: 55px;}
.frame.kg .expertise-grid, .frame.kg .projects-grid, .frame.kg .services-grid, .frame.kg .process{grid-template-columns: 1fr;}
.frame.kg .projects-grid .project-card:last-child:nth-child(odd){grid-column: auto;}
.frame.kg .expertise-card{min-height: 0;}
.frame.kg .contact-panel{grid-template-columns: 1fr;}
.frame.kg .footer-main{grid-template-columns: 1fr; gap: 22px;}
.frame.kg .footer-bottom{flex-direction: column; align-items: flex-start;}}

/* ===== Kalpesh portfolio (glass theme) : added to the website builder ===== */
.frame.kg{--kbg:var(--sb);--ktext:var(--st);--kpurple:var(--p);--kmuted:var(--m);--klavender:var(--l);--kviolet:var(--v);--kmint:var(--g);--kline:rgba(222,207,255,.15);--kradius:24px;--kshadow:0 20px 80px rgba(0,0,0,.28);--kglass:rgba(255,255,255,.055);--kglass-strong:rgba(255,255,255,.085);--kbg-soft:#0e0d16;
 position:relative;color:var(--kbg-text,var(--st));line-height:1.65;overflow-x:clip;-webkit-text-size-adjust:100%}
.frame.kg:not(.ed){background:transparent}
.frame.kg{color:var(--st)}
.frame.kg.ed{background:var(--sb)}
.frame.kg .blk.kb{padding:0}
.frame.kg .blk:not(.kb){width:min(1120px,calc(100% - 40px));margin-inline:auto;padding:12px 0}
.frame.kg .blk.ksec{padding-top:78px}
.frame.kg .blk.kabout,.frame.kg .blk.kexp,.frame.kg .blk.kproj,.frame.kg .blk.ksvc{padding-bottom:78px}
.frame.kg .blk.kcontact{padding-block:78px}
.frame.kg .blk.khero{padding:0}
.frame.kg .btn,.frame.kg a.btn{background:linear-gradient(135deg,#f0e7ff,#b49aff);color:#171020;border-radius:999px;font-weight:700}
.frame.kg [data-p] a{color:var(--klavender);text-decoration:underline;text-underline-offset:3px}
.frame.kg .brand-logo{width:38px;height:38px;border-radius:12px;object-fit:cover}
.frame.kg .menu-toggle:hover:not(:disabled){background:var(--kglass)}
.frame.kg .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
.frame.kg .kchip{position:absolute;right:10px;bottom:10px;z-index:3;padding:5px 11px;font-size:11px;border-radius:999px;background:rgba(8,8,13,.75);color:#e9deff;border:1px dashed rgba(233,222,255,.5);cursor:pointer}
.frame.kg .process-step i.pt{font-style:normal}

const GH={repo:'',tok:''};

async function ghget(p){const r=await ghf(p);if(r.status==404)return null;if(!r.ok)throw new Error('GitHub error '+r.status);return r.json()}

 throw new Error('Could not save, please try again')}
